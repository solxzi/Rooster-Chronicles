<style>
:root{
  --bg:#fff1d6; --fg:#4a2a14; --muted:#8a6a4a; --pad:#ffffffd9; --padbd:#4a2a14; --padfg:#4a2a14;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1b1611; --fg:#ffe9c7; --muted:#b69a78; --pad:#2d241bd9; --padbd:#ffe9c7; --padfg:#ffe9c7; }
}
:root[data-theme="dark"]{ --bg:#1b1611; --fg:#ffe9c7; --muted:#b69a78; --pad:#2d241bd9; --padbd:#ffe9c7; --padfg:#ffe9c7; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--fg);
  font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
#stage{display:flex;flex-direction:column;align-items:center;width:100%;}
#game{display:block;border:4px solid var(--padbd);outline:none;background:#000;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
#bar{display:flex;gap:8px;margin-top:10px;}
#bar button{
  font:inherit;font-size:9px;padding:7px 10px;background:var(--pad);color:var(--padfg);
  border:3px solid var(--padbd);cursor:pointer;
}
#bar button:active{transform:translateY(2px);}
.hint{font-size:8px;color:var(--muted);margin:10px 10px 0;text-align:center;line-height:1.7;}
#touch{display:none;width:100%;max-width:900px;justify-content:space-between;align-items:center;padding:10px 14px;box-sizing:border-box;}
body.touch #touch{display:flex;}
#touch .grp{display:flex;gap:12px;align-items:center;}
#touch button{
  font:inherit;font-size:14px;width:64px;height:64px;background:var(--pad);color:var(--padfg);
  border:4px solid var(--padbd);touch-action:none;-webkit-tap-highlight-color:transparent;
}
#touch button.wide{width:84px;font-size:9px;}
#touch button.on{transform:translateY(3px);filter:brightness(.85);}
@media (orientation:landscape) and (max-height:520px){
  .hint{display:none;}
  body.touch #touch{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);padding:0 18px;pointer-events:none;}
  body.touch #touch .grp{pointer-events:auto;}
  body.touch #touch button{opacity:.55;}
}
</style>
</head>

</main>

/* ================= constants ================= */
const TS=32, ROWS=14, VW=768, VH=ROWS*TS;                    // logical screen units (VW) / level height
let COLS=24;                                                  // columns in the CURRENT level (levels vary in length)
const SC=0.5, DW=VW*SC, DH=VH*SC;                            // pixel buffer: 384 x 224
const ZOOM=1.5, WS=SC*ZOOM;                                   // camera zoom: world unit -> buffer px (tile = 24px)
const VIEWW=VW/ZOOM, VIEWH=VH/ZOOM;                           // how much world the camera sees
const PW=22, PH=26;
const GRAV=0.55, MAXFALL=11, JUMP=10.5, MAXSPD=3.2, SPRING=16.2, GLIDEFALL=1.4, GLIDE_MAX=60;
const OUT='#3a2414', TAU=Math.PI*2;

/* ================= levels ================= */
function grid(cols,fn){
  const g=Array.from({length:ROWS},()=>Array(cols).fill('.'));
  const R=(c1,r1,c2,r2,ch)=>{ch=ch||'#';for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)g[r][c]=ch;};
  const P=(c,r,ch)=>{g[r][c]=ch;};
  fn(R,P);
  return g.map(row=>row.join(''));
}

].forEach((o,i)=>Object.assign(LEVELS[i+5].pal,o));
const TITLE_ROWS=grid(24,R=>{R(0,12,23,13);});
const TITLE_PAL=Object.assign({},LEVELS[0].pal,{barn:{x:640,s:1.3},sun:{x:110,y:84,r:32,col:'#ffe27a'}});
const END_PAL=Object.assign({},LEVELS[4].pal,{sun:null,barn:{x:640,s:1.5}});

/* ================= game logic ================= */
const hooks={};
function ev(t,x,y){ if(hooks.onEvent) hooks.onEvent(t,x,y); }
let GRID=LEVELS[0].rows, CUR=null;
function tile(c,r){
  if(c<0||c>=COLS) return '#';
  if(r<0||r>=ROWS) return '.';
  const ch=GRID[r][c];
  switch(ch){
    case 'R': return CUR.sw===0?'#':'.';
    case 'B': return CUR.sw===1?'#':'.';
    case 'L': return CUR.doors[r*COLS+c]?'.':'#';
    case 'c': { const d=CUR.cm[r*COLS+c]; return (d&&d.st===2)?'.':'#'; }
  }
  return ch;
}
function aabb(ax,ay,aw,ah,bx,by,bw,bh){ return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by; }

function newState(li){
  const L=LEVELS[li]; GRID=L.rows; COLS=GRID[0].length;
  const S={li,t:0,p:null,foxes:[],crows:[],plats:[],corn:[],springs:[],traps:[],goal:null,
    wait:true,ig:0,hawks:[],scars:[],moles:[],maces:[],forks:[],boss:null,keyItems:[],pads:[],cm:{},doors:{},locks:[],keys:0,sw:0,dead:false,deadT:0,win:false,winT:0};
  CUR=S;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const ch=GRID[r][c];
    if(ch==='P') S.p={x:c*TS+(TS-PW)/2,y:(r+1)*TS-PH,vx:0,vy:0,w:PW,h:PH,face:1,ground:false,was:false,coy:0,jbuf:0,ride:-1,spr:false,gl:false,gt:GLIDE_MAX,sq:0,wk:0};
    else if(ch==='C') S.corn.push({c,r,got:false});
    else if(ch==='Y') S.keyItems.push({c,r,got:false});
    else if(ch==='T') S.pads.push({c,r,on:false});
    else if(ch==='c') S.cm[r*COLS+c]={c,r,st:0,t:0};
    else if(ch==='S') S.springs.push({c,r,comp:0});
    else if(ch==='p') S.traps.push({c,r,h:0,up:false});
    else if(ch==='F'||ch==='f'){ const cx=c*TS+TS/2, rg=ch==='F'?64:128; S.foxes.push({x:cx,y:(r+1)*TS,dir:1,sp:0.9,minX:cx-rg,maxX:cx+rg}); }
    else if(ch==='K'||ch==='k'){ const cx=c*TS+TS/2, cy=r*TS+TS/2; S.crows.push({cx,cy,ax:ch==='k'?64:0,ay:ch==='K'?40:0,per:ch==='k'?200:110,x:cx,y:cy,dir:1}); }
    else if(ch==='H') S.goal={c,r};
    else if(ch==='W') S.hawks.push({hx:c*TS+16,hy:r*TS+16,x:c*TS+16,y:r*TS+16,st:0,t:0,tx:0,ty:0});
    else if(ch==='N') S.scars.push({x:c*TS+16,y:(r+1)*TS,t:60+(c%5)*20,dir:-1});
    else if(ch==='M') S.moles.push({c,r,off:(c*37)%150});
    else if(ch==='O') S.maces.push({x:c*TS+16,y:r*TS+4,L:160,ph:c*0.9,x2:c*TS+16,y2:r*TS+164});
    else if(ch==='X') S.boss={x:c*TS+16,y:(r+1)*TS,y0:(r+1)*TS,vx:0,vy:0,hp:3,st:'idle',t:0,n:0,dir:-1,cdir:-1,inv:0,minX:(L.arena?L.arena[0]:0)*TS+50,maxX:(L.arena?L.arena[1]:COLS)*TS};
  }
  for(let c=0;c<COLS;c++){            // padlock sits on the middle tile of each door column
    let r=0;
    while(r<ROWS){
      if(GRID[r][c]==='L'){ let e=r; while(e+1<ROWS&&GRID[e+1][c]==='L') e++; S.locks.push({c,r:Math.floor((r+e)/2)}); r=e+1; } else r++;
    }
  }
  for(const m of L.mp){ const [c0,r0,c1,r1,wt,sp]=m; S.plats.push({x:c0*TS,y:r0*TS,w:wt*TS,x0:c0*TS,y0:r0*TS,x1:c1*TS,y1:r1*TS,sp,ph:0,dn:1,dx:0,dy:0}); }
  S.cam={x:0,y:0}; camUpdate(S,true);
  return S;
}

/* camera: keeps the rooster centred, clamped to the level edges */
function camUpdate(S,snap){
  const p=S.p, tx=p.x+p.w/2-VIEWW/2, ty=p.y+p.h/2-VIEWH/2;
  const mx=Math.max(0,COLS*TS-VIEWW), my=Math.max(0,VH-VIEWH);
  const cx=Math.max(0,Math.min(mx,tx)), cy=Math.max(0,Math.min(my,ty));
  if(snap){ S.cam.x=cx; S.cam.y=cy; } else { S.cam.x+=(cx-S.cam.x)*0.2; S.cam.y+=(cy-S.cam.y)*0.12; }
}

function moveX(p,dx){
  if(!dx) return;
  p.x+=dx;
  if(p.x<0){p.x=0;p.vx=0;} else if(p.x+p.w>COLS*TS){p.x=COLS*TS-p.w;p.vx=0;}
  const r0=Math.floor(p.y/TS), r1=Math.floor((p.y+p.h-0.01)/TS), c0=Math.floor(p.x/TS), c1=Math.floor((p.x+p.w-0.01)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    if(tile(c,r)==='#'){ p.x=dx>0?c*TS-p.w:(c+1)*TS; p.vx=0; return; }
  }
}
function moveY(S,p,dy){
  const pb=p.y+p.h;
  p.y+=dy;
  const c0=Math.floor(p.x/TS), c1=Math.floor((p.x+p.w-0.01)/TS);
  const r0=Math.floor(p.y/TS), r1=Math.floor((p.y+p.h-0.01)/TS);
  if(dy>0){
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
      const t=tile(c,r);
      if(t==='#'||(t==='-'&&pb<=r*TS+0.01)){ p.y=r*TS-p.h; p.vy=0; p.ground=true; return; }
    }
  } else if(dy<0){
    for(let r=r1;r>=r0;r--)for(let c=c0;c<=c1;c++){
      if(tile(c,r)==='#'){ p.y=(r+1)*TS; p.vy=0; return; }
    }
  }
  if(dy>=0){
    for(let i=0;i<S.plats.length;i++){
      const m=S.plats[i];
      if(p.x+p.w>m.x+1&&p.x<m.x+m.w-1&&pb<=m.y+4&&p.y+p.h>=m.y){ p.y=m.y-p.h; p.vy=0; p.ground=true; p.ride=i; return; }
    }
  }
}
function updPlat(m){
  const ox=m.x, oy=m.y, dx=m.x1-m.x0, dy=m.y1-m.y0, len=Math.hypot(dx,dy)||1;
  m.ph+=m.dn*m.sp/len;
  if(m.ph>=1){m.ph=1;m.dn=-1;} else if(m.ph<=0){m.ph=0;m.dn=1;}
  m.x=m.x0+dx*m.ph; m.y=m.y0+dy*m.ph; m.dx=m.x-ox; m.dy=m.y-oy;
}
function updFox(f){
  f.x+=f.dir*f.sp;
  if(f.x<f.minX){f.x=f.minX;f.dir=1;} else if(f.x>f.maxX){f.x=f.maxX;f.dir=-1;}
  const fc=Math.floor((f.x+f.dir*13)/TS), rr=Math.floor((f.y+2)/TS);
  const below=tile(fc,rr), ahead=tile(fc,rr-1);
  if((below!=='#'&&below!=='-')||ahead==='#'||ahead==='^'){ f.x-=f.dir*f.sp; f.dir=-f.dir; }
}
function updCrow(S,cw){
  const a=TAU*S.t/cw.per;
  cw.x=cw.cx+cw.ax*Math.sin(a); cw.y=cw.cy+cw.ay*Math.sin(a);
  if(cw.ax) cw.dir=Math.cos(a)>=0?1:-1;
}
function updTraps(S){
  const p=S.p, pcx=p.x+p.w/2, pby=p.y+p.h;
  for(const t of S.traps){
    const tx=t.c*TS+TS/2, dx=Math.abs(pcx-tx), dyy=Math.abs(pby-(t.r+1)*TS);
    if(dx<56&&dyy<90){
      if(t.h<1){ t.h=Math.min(1,t.h+0.1); if(!t.up&&t.h>0.3){ t.up=true; ev('pop',tx,(t.r+1)*TS); } }
    } else if(dx>110){ t.h=Math.max(0,t.h-0.03); if(t.h<=0) t.up=false; }
  }
}
function updCrumble(S){
  const p=S.p;
  for(const k in S.cm){
    const d=S.cm[k], x=d.c*TS, y=d.r*TS;
    if(d.st===0){
      if(p.ground&&Math.abs(p.y+p.h-y)<0.6&&p.x+p.w>x+1&&p.x<x+TS-1){ d.st=1; d.t=0; ev('crumble',x+16,y); }
    } else if(d.st===1){
      if(++d.t>=22){ d.st=2; d.t=0; ev('crumbled',x+16,y+16); }
    } else if(++d.t>=170&&!aabb(p.x,p.y,p.w,p.h,x,y,TS,TS)){ d.st=0; d.t=0; }
  }
}
function toggleSwitch(S){
  const p=S.p, nsw=1-S.sw, solidCh=nsw===0?'R':'B';
  const c0=Math.floor(p.x/TS), c1=Math.floor((p.x+p.w-0.01)/TS), r0=Math.floor(p.y/TS), r1=Math.floor((p.y+p.h-0.01)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){ if(r>=0&&r<ROWS&&c>=0&&c<COLS&&GRID[r][c]===solidCh) return false; }
  S.sw=nsw; ev('switch',p.x+p.w/2,p.y+p.h); return true;
}
function openDoor(S,c,r){
  const st=[[c,r]];
  while(st.length){
    const [x,y]=st.pop();
    if(x<0||x>=COLS||y<0||y>=ROWS||GRID[y][x]!=='L'||S.doors[y*COLS+x]) continue;
    S.doors[y*COLS+x]=true; ev('unlock',x*TS+16,y*TS+16);
    st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
}
function hurt(S){
  const p=S.p, hx=p.x+3, hy=p.y+3, hw=p.w-6, hh=p.h-5;
  if(p.y>VH+30) return true;
  const c0=Math.floor(hx/TS), c1=Math.floor((hx+hw)/TS), r0=Math.floor(hy/TS), r1=Math.floor((hy+hh)/TS);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    const t=tile(c,r);
    if(t==='^'&&aabb(hx,hy,hw,hh,c*TS+5,r*TS+14,22,18)) return true;
    if(t==='v'&&aabb(hx,hy,hw,hh,c*TS+5,r*TS,22,18)) return true;
  }
  for(const t of S.traps) if(t.h>0.5&&aabb(hx,hy,hw,hh,t.c*TS+4,(t.r+1)*TS-22*t.h,24,22*t.h)) return true;
  for(const f of S.foxes) if(aabb(hx,hy,hw,hh,f.x-12,f.y-17,24,16)) return true;
  for(const cw of S.crows) if(aabb(hx,hy,hw,hh,cw.x-9,cw.y-8,18,16)) return true;
  for(const h of S.hawks) if(aabb(hx,hy,hw,hh,h.x-10,h.y-8,20,16)) return true;
  for(const m of S.maces) if(aabb(hx,hy,hw,hh,m.x2-14,m.y2-14,28,28)) return true;
  for(const m of S.moles){ const ph=(S.t+m.off)%220; if(ph>=150&&ph<210&&aabb(hx,hy,hw,hh,m.c*TS+4,(m.r+1)*TS-26,24,26)) return true; }
  for(const f of S.forks){ if(f.t<0) continue;
    if(f.k==='f'&&aabb(hx,hy,hw,hh,f.x-12,f.y-3,24,6)) return true;
    if(f.k==='w'&&aabb(hx,hy,hw,hh,f.x-9,f.y-16,18,16)) return true;
    if(f.k==='d'&&aabb(hx,hy,hw,hh,f.x-8,f.y-14,16,28)) return true; }
  { const b=S.boss; if(b&&b.st!=='dead'&&b.inv<=0&&aabb(hx,hy,hw,hh,b.x-30,b.y-52,60,52)) return true; }
  return false;
}
function kill(S){ const p=S.p; S.dead=true; S.deadT=0; ev('die',p.x+p.w/2,p.y+p.h/2); }

function updBoss(S){
  const b=S.boss; if(!b) return;
  if(b.st==='dead'){ b.t++; return; }
  const p=S.p, pc=p.x+p.w/2, ph=3-b.hp; b.t++; if(b.inv>0) b.inv--; if(S.bossMsg) S.bossMsg.t--;
  if(b.st==='idle'){
    b.dir=pc<b.x?-1:1;
    if(b.t>=60-ph*14){
      let a=ph===0?['charge','leap'][b.n++%2]:ph===1?['charge','leap','rain'][b.n++%3]:['rain','charge','leap','charge','rain','leap'][b.n++%6];
      b.st=a; b.t=0; b.cdir=b.dir; b.bn=false;
      if(a==='leap'){ b.vy=-12.5; b.vx=Math.max(-5,Math.min(5,(pc-b.x)/34)); }
      if(a==='rain') for(let i=0;i<3+ph*2;i++) S.forks.push({k:'d',x:pc+(i-1-ph)*60+(Math.random()-0.5)*28,y:0,vy:0,t:-(50-ph*12)-i*(10-ph*3)});
    }
  } else if(b.st==='charge'){
    b.x+=b.cdir*(3.4+ph*1.5);
    if(b.x<b.minX||b.x>b.maxX){ b.x=Math.max(b.minX,Math.min(b.maxX,b.x)); if(ph>=2&&!b.bn){ b.bn=true; b.cdir*=-1; shake=Math.max(shake,8); } else { b.st='idle'; b.t=-40+ph*10; shake=Math.max(shake,8); } }
  } else if(b.st==='leap'){
    b.x=Math.max(b.minX,Math.min(b.maxX,b.x+b.vx)); b.vy+=0.6; b.y+=b.vy;
    if(b.y>=b.y0){ b.y=b.y0; b.st='idle'; b.t=-10+ph*8; shake=12; ev('slam',b.x,b.y);
      const v=3.2+ph*0.9; S.forks.push({k:'w',x:b.x-30,y:b.y,vx:-v,t:0},{k:'w',x:b.x+30,y:b.y,vx:v,t:0}); if(ph>=2) S.forks.push({k:'w',x:b.x-30,y:b.y,vx:-v,t:-28},{k:'w',x:b.x+30,y:b.y,vx:v,t:-28}); }
  } else if(b.st==='rain'){ if(b.t>110-ph*20){ b.st='idle'; b.t=0; } }
}
function bossStomp(S){
  const b=S.boss, p=S.p; if(!b||b.st==='dead'||b.inv>0) return;
  if(p.vy>0&&aabb(p.x,p.y,p.w,p.h,b.x-34,b.y-60,68,40)&&p.y+p.h-p.vy<=b.y-52+16){
    b.hp--; p.vy=-11; p.gl=false; p.gt=GLIDE_MAX; ev('stomp',b.x,b.y-52);
    if(b.hp<=0){
      b.st='dead'; b.t=0; b.y=b.y0; S.forks.length=0;
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(GRID[r][c]==='L') openDoor(S,c,r);
      ev('win',b.x,b.y-40);
    } else { b.st='idle'; b.t=-50+(3-b.hp)*10; b.inv=100; b.y=b.y0; S.bossMsg={t:150,s:b.hp===2?'The Fox King is getting serious!':'The Fox King is ENRAGED!'}; shake=Math.max(shake,14); }
  }
}
function updNew(S){
  const p=S.p, pc=p.x+p.w/2;
  for(const h of S.hawks){ h.t++;
    if(h.st===0){ h.x=h.hx; h.y=h.hy+Math.sin(S.t*0.08+h.hx)*4; if(h.t>50&&Math.abs(pc-h.hx)<140&&p.y>h.hy&&p.y-h.hy<330){ h.st=1; h.t=0; } }
    else if(h.st===1){ h.x=h.hx+(S.t&1?2:-2); if(h.t>34){ h.st=2; h.t=0; h.tx=pc; h.ty=p.y+p.h/2; } }
    else if(h.st===2){ const dx=h.tx-h.x, dy=h.ty-h.y, d=Math.hypot(dx,dy)||1; h.x+=dx/d*6.5; h.y+=dy/d*6.5;
      if(d<8||tile(Math.floor(h.x/TS),Math.floor(h.y/TS))==='#'||h.t>70){ h.st=3; h.t=0; } }
    else { const dx=h.hx-h.x, dy=h.hy-h.y, d=Math.hypot(dx,dy)||1; if(d<4){ h.st=0; h.t=0; } else { h.x+=dx/d*2.6; h.y+=dy/d*2.6; } }
  }
  for(const s of S.scars){ s.dir=pc<s.x?-1:1;
    if(--s.t<=0&&Math.abs(pc-s.x)<280&&Math.abs(p.y+p.h-s.y)<140){ s.t=210; S.forks.push({k:'f',x:s.x+s.dir*16,y:s.y-20,vx:s.dir*3.3,t:0}); }
    else if(s.t<0) s.t=0; }
  for(const m of S.maces){ const a=1.0*Math.sin(TAU*S.t/150+m.ph); m.x2=m.x+m.L*Math.sin(a); m.y2=m.y+m.L*Math.cos(a); }
  updBoss(S);
  for(let i=S.forks.length-1;i>=0;i--){ const f=S.forks[i]; f.t++; if(f.t<0) continue;
    if(f.k==='d'){ f.vy=Math.min(9,f.vy+0.5); f.y+=f.vy; if(tile(Math.floor(f.x/TS),Math.floor((f.y+14)/TS))==='#'||f.y>VH) S.forks.splice(i,1); }
    else { f.x+=f.vx; if(tile(Math.floor(f.x/TS),Math.floor((f.y-6)/TS))==='#'||f.x<0||f.x>COLS*TS||f.t>400) S.forks.splice(i,1); } }
}
/* inp: {l,r,jh (jump held),jp (jump pressed this frame),gl (glide held)} */
function step(S,inp){
  CUR=S; GRID=LEVELS[S.li].rows; COLS=GRID[0].length;
  S.t++;
  const p=S.p;
  for(const sp of S.springs) if(sp.comp>0) sp.comp=Math.max(0,sp.comp-0.08);
  if(S.dead){ S.deadT++; return; }
  for(const m of S.plats) updPlat(m);
  for(const f of S.foxes) updFox(f);
  for(const cw of S.crows) updCrow(S,cw);
  updTraps(S); updCrumble(S); updNew(S);
  if(S.win){
    S.winT++; p.vx*=0.8; p.gl=false; moveX(p,p.vx);
    p.vy=Math.min(MAXFALL,p.vy+GRAV); p.ground=false; moveY(S,p,p.vy);
    return;
  }
  if(p.ride>=0){ const m=S.plats[p.ride]; moveX(p,m.dx); p.y+=m.dy; }
  p.ride=-1;
  const acc=p.ground?0.62:0.4, fr=p.ground?0.7:0.12;
  if(inp.l===inp.r){
    if(p.vx>0) p.vx=Math.max(0,p.vx-fr); else if(p.vx<0) p.vx=Math.min(0,p.vx+fr);
  } else {
    const d=inp.r?1:-1; p.face=d; p.vx+=d*acc;
    if(p.vx>MAXSPD) p.vx=MAXSPD; if(p.vx<-MAXSPD) p.vx=-MAXSPD;
  }
  if(inp.jp) p.jbuf=7; else if(p.jbuf>0) p.jbuf--;
  if(p.ground) p.coy=6; else if(p.coy>0) p.coy--;

function nextLevel(){

function toTitle(){ mode='title'; parts.length=0; }

function tick(){
  T++;
  if(settingsOpen){ if(mode==='play'&&!paused) settingsOpen=false; else pressed.act=pressed.jump=pressed.restart=pressed.pause=pressed.enter=false; }
  if(pressed.mute) toggleMute();
  if(mode==='title'){
    if(pressed.act||pressed.jump){ sfx('menu'); startGame(!!(saved&&saved.level>0)); }
  } else if(mode==='play'){
    if(pressed.pause) paused=!paused;
    if(pressed.restart&&!paused&&!S.win) restartLevel();
    if(!paused){
      const inp={l:keys.l||touch.l,r:keys.r||touch.r,jh:keys.j||touch.j,jp:pressed.jump,gl:keys.g||touch.g};
      step(S,inp); camUpdate(S,false); updWorld();
      if(!S.dead&&!S.win) pushTrail();
      if(S.win&&S.winT%7===1) hearts(S.p.x+S.p.w/2,S.p.y,2);
      if(S.dead&&S.deadT>=50) restartLevel();
      if(S.win&&S.winT>=75){ if(S.li+1>=LEVELS.length) enterCard(); else { mode='reunion'; reT=0; rePage=0; reChars=0; parts.length=0; } }
      if(banner>0) banner--;
    }
  } else if(mode==='card'){
    cardT++;
    nextLevel();
  } else if(mode==='bossIntro'){
    biT++; const full=BOSS_LINES[biPage][1].length+2;
    if(biT>=30&&biChars<full) biChars=Math.min(full,biChars+0.8);
    if(pressed.enter&&biT>20){ if(biChars<full) biChars=full; else if(biPage<BOSS_LINES.length-1){ biPage++; biChars=0; } else { mode='play'; banner=190; shake=10; sfx('win'); } }
  } else if(mode==='reunion'){
    reT++; if(reT>70&&reT%14===0) hearts(300+Math.random()*100,300,2);
    const rc=LEVELS[S.li].chick, full=(rePage===0?rc.quote.length:rc.dad.length)+2;
    if(reT>=60&&reChars<full) reChars=Math.min(full,reChars+0.8);
    if(pressed.enter&&reT>50){ if(reChars<full) reChars=full; else if(rePage===0){ rePage=1; reChars=0; } else enterCard(); }
  } else if(mode==='scene'){
    const hold=SCENE_HOLDS.find(h=>sceneT<=h);
    if(sceneT<hold) sceneT++; else if(pressed.enter){ if(hold===SCENE_HOLDS[3]){ mode='end'; endT=0; parts.length=0; sfx('win'); } else sceneT++; }
    if(sceneT>330&&sceneT%12===0) hearts(300+Math.random()*360,300,2);
  } else if(mode==='end'){
    endT++;
    if(endT%10===0) confetti(6,0,VW,-10);
    if(endT>90&&(pressed.act||pressed.jump)) toTitle();
  }
  shake*=0.85; if(shake<0.3) shake=0;
  if(!paused&&curCrit) updCrit(curCrit);
  if(mode!=='play'||paused) rainSound(0);
  updParts();
  pressed.jump=pressed.act=pressed.restart=pressed.pause=pressed.mute=pressed.enter=false;
}

/* ================= pixel pipeline ================= */
const QN=10, QSTEP=255/(QN-1);
const QL=new Uint8ClampedArray(256);
for(let i=0;i<256;i++) QL[i]=Math.round(Math.round(i/QSTEP)*QSTEP);
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

/* hard-edge the antialiased vector art and snap it to a limited palette */
function pixelize(g,x0,y0,w,h,dither){
  const id=g.getImageData(x0,y0,w,h), d=id.data;
  for(let y=0,i=0;y<h;y++)for(let x=0;x<w;x++,i+=4){
    if(d[i+3]<100){ d[i+3]=0; continue; }
    d[i+3]=255;
    const off=dither?(BAYER[((y+y0)&3)*4+(x&3)]/16-0.47)*QSTEP:0;
    d[i]=QL[Math.max(0,Math.min(255,(d[i]+off)|0))];
    d[i+1]=QL[Math.max(0,Math.min(255,(d[i+1]+off)|0))];
    d[i+2]=QL[Math.max(0,Math.min(255,(d[i+2]+off)|0))];
  }
  g.putImageData(id,x0,y0);
}

  sctx.clearRect(0,ry,DW,rh);
  const keep=ctx; ctx=sctx; ctx.setTransform(xf[0],0,0,xf[0],xf[1]+sh[0],xf[2]+sh[1]);
  fn();
  ctx=keep;
  sctx.setTransform(1,0,0,1,0,0);
  pixelize(sctx,0,ry,DW,rh,false);
  const m=mctx.getTransform();
  mctx.setTransform(1,0,0,1,0,0);
  mctx.drawImage(scv,0,ry,DW,rh,0,ry,DW,rh);
  mctx.setTransform(m);
}

  ctx.setTransform(SC,0,0,SC,0,0);
  const L=t<150?'Fox King: Fine! You win!':t<300?'Fox King: *runs away crying*':t<520?'Chicks: DAAAD!':'Dad: Let us go home!';
  panel(40,40,688,64,'rgba(255,246,224,0.95)',OUT); txt(L,VW/2,72,8,OUT,'center');
  if(SCENE_HOLDS.includes(t)&&Math.floor(T/30)%2===0) txt('Enter: continue',VW-20,VH-16,8,'#fff3d6','right',OUT);
}
const SCENE_HOLDS=[149,299,519,700];
const BOSS_LINES=[
  ['Fox King',"Well, well. The little rooster actually made it all the way to my forest."],
  ['Papa Rooster',"Where is my last chick, Fox King?"],
  ['Fox King',"Safe behind me. For now. Nobody takes what I've stolen from this forest."],
  ['Papa Rooster',"Nine of my chicks are already home. I'm not leaving without the tenth."],
  ['Fox King',"Then come and crow your last song, bird. I'll make it a short one."],
  ['Papa Rooster',"I've come too far to lose now. Let's finish this."]];
function drawBossIntro(){
  const L=LEVELS[S.li], pal=Object.assign({},L.pal,{barn:[]}), bg=getBG('bi',pal,TITLE_ROWS), t=biT;
  const who=BOSS_LINES[biPage][0], line=BOSS_LINES[biPage][1], fox=who==='Fox King', typing=t>=30&&biChars<line.length+2;
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.drawImage(bg.sky,0,0,VW,VH); drawClouds(pal); ctx.drawImage(bg.land,0,0,VW,VH);
  const kx=580+Math.max(0,60-t)*8, hop=fox&&typing?Math.abs(Math.sin(T*0.35))*3:0;
  sprites(()=>{
    drawRooster(200,384,1,{scale:2.8,t:T,beak:!fox&&typing?Math.floor(T/5)%2:0});
    ctx.save(); ctx.translate(kx,384-hop); ctx.scale(4.2,4.2); drawFox(0,0,-1,T*(t<60?1.4:0.3)); ctx.scale(-1,1);
    ctx.fillStyle='#ffd23f'; ctx.strokeStyle=OUT; ctx.lineWidth=1.6; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(6,-22); ctx.lineTo(6,-29); ctx.lineTo(9,-25); ctx.lineTo(12,-30); ctx.lineTo(15,-25); ctx.lineTo(18,-29); ctx.lineTo(18,-22); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  });
  ctx.setTransform(SC,0,0,SC,0,0);
  if(t>=30){
    const lines=wrap('"'+line+'"',640,8); let left=Math.floor(biChars);
    panel(40,30,688,40+lines.length*26,fox?'rgba(255,238,224,0.96)':'rgba(226,241,255,0.96)',OUT);
    txt(who+' says:',60,52,8,fox?'#b5401b':'#2a6fa8','left');
    lines.forEach((l,i)=>{ txt(l.slice(0,Math.max(0,left)),60,80+i*26,8,OUT,'left'); left-=l.length+1; });
    if(typing) txt('Enter: show all',VW-20,VH-16,8,'#fff3d6','right',OUT);
    else if(Math.floor(T/30)%2===0) txt(biPage<BOSS_LINES.length-1?'Enter: continue':'Enter: FIGHT!',VW-20,VH-16,8,'#fff3d6','right',OUT);
  }
}
function drawReunion(){
  const L=LEVELS[S.li], ch=L.chick, t=reT, pal=Object.assign({},L.pal,{barn:{x:640,s:1.3}});
  const bg=getBG('re'+S.li,pal,TITLE_ROWS);
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.drawImage(bg.sky,0,0,VW,VH); drawClouds(pal); ctx.drawImage(bg.land,0,0,VW,VH);
  const k=Math.min(1,t/60), cx=700+(300-700)*k, hug=t>=60, talk=rePage===1&&reChars<ch.dad.length+2;
  sprites(()=>{
    crit('re'+S.li,bg);
    drawRooster(230,384,1,{scale:2.8,t:T,beak:talk?Math.floor(t/5)%2:(rePage===0&&hug?1:0),sy:1+(hug?Math.abs(Math.sin(t*0.2))*0.04:0)});
    drawChick(cx,384,-1,{scale:3,col:ch.col,acc:ch.acc,hop:hug?Math.abs(Math.sin(t*0.25))*16:(k<1?Math.abs(Math.sin(t*0.4))*8:0),cheer:hug,t:T});
    drawParts();
  });
  ctx.setTransform(SC,0,0,SC,0,0);
  if(t>=60){
    const q='"'+ch.quote+'"', lines=wrap(q,640,8), h1=40+lines.length*26; let left=rePage===0?Math.floor(reChars):1e9;
    panel(40,30,688,h1,'rgba(255,246,224,0.96)',OUT);
    txt(ch.name+' says:',60,52,8,'#b5401b','left');
    lines.forEach((l,i)=>{ txt(l.slice(0,Math.max(0,left)),60,80+i*26,8,OUT,'left'); left-=l.length+1; });
    if(rePage>=1){ const dl=wrap('"'+ch.dad+'"',640,8), y0=30+h1+10; let l2=Math.floor(reChars);
      panel(40,y0,688,40+dl.length*26,'rgba(226,241,255,0.96)',OUT);
      txt('Papa Rooster says:',60,y0+22,8,'#2a6fa8','left');
      dl.forEach((l,i)=>{ txt(l.slice(0,Math.max(0,l2)),60,y0+50+i*26,8,OUT,'left'); l2-=l.length+1; }); }
  }
  if(t>=60){ const done=reChars>=(rePage===0?ch.quote.length:ch.dad.length)+2;
    if(!done) txt('Enter: show all',VW-20,VH-16,8,'#fff3d6','right',OUT);
    else if(Math.floor(T/30)%2===0) txt(rePage===0?'Enter: continue':'Enter: next',VW-20,VH-16,8,'#fff3d6','right',OUT); }
}
function drawPause(){
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.fillStyle='rgba(20,10,4,0.6)'; ctx.fillRect(0,0,VW,VH);
  txt('Paused',VW/2,VH/2-14,24,'#ffd23f','center',OUT);
  txt('P or tap to resume',VW/2,VH/2+36,8,'#fff3d6','center');
  pauseBtn={x:VW/2-180,y:VH/2+66,w:360,h:48};
  panel(pauseBtn.x,pauseBtn.y,pauseBtn.w,pauseBtn.h,'#fff3d6',OUT);
  txt('Settings',VW/2,pauseBtn.y+25,8,OUT,'center');
}
function drawSettings(){
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.fillStyle='rgba(20,10,4,0.78)'; ctx.fillRect(0,0,VW,VH);
  panel(VW/2-240,VH/2-150,480,300,'#fff6e0',OUT);
  txt('Settings',VW/2,VH/2-108,16,'#ff7b2f','center',OUT);
  setBtns=[];
  [['flash','Lightning flashes: '+(flashOn?'ON':'OFF')],['amb','Background noise: '+(ambOn?'ON':'OFF')],['back','Back']].forEach(([id,l],i)=>{
    const b={id,x:VW/2-180,y:VH/2-70+i*64,w:360,h:48}; setBtns.push(b);
    panel(b.x,b.y,b.w,b.h,'#fff3d6',OUT); txt(l,VW/2,b.y+25,8,OUT,'center'); });
  txt('Esc closes',VW/2,VH/2+128,8,'#8a6a4a','center');
}
function render(){
  ctx=mctx; ctx.imageSmoothingEnabled=false; curCrit=null;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,DW,DH);
  if(mode==='title') drawTitle();
  else if(mode==='reunion') drawReunion();
  else if(mode==='bossIntro') drawBossIntro();
  else if(mode==='scene') drawScene();
  else if(mode==='end') drawEnd();
  else { drawPlay(); if(mode==='card') drawCard(); if(paused) drawPause(); }
  if(settingsOpen) drawSettings();
}

/* ================= shell (DOM) ================= */
function toggleMute(){ muted=!muted; ac(); const b=document.getElementById('bSound'); if(b) b.textContent='Sound: '+(muted?'off':'on'); }
function fit(){
  const root=document.documentElement, cs=getComputedStyle(root);
  const padV=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  const touchEl=document.getElementById('touch'), bar=document.getElementById('bar'), hint=document.getElementById('hint');
  const tcs=getComputedStyle(touchEl), hcs=getComputedStyle(hint);
  let used=bar.offsetHeight+10+24+8;
  if(hcs.display!=='none') used+=hint.offsetHeight+10;
  if(tcs.display!=='none'&&tcs.position!=='fixed') used+=touchEl.offsetHeight;
  const availW=root.clientWidth-24, availH=window.innerHeight-padV-used;
  let w=Math.min(availW,availH*DW/DH,1200);
  w=Math.max(240,w);
  const k=w>=DW?Math.max(1,Math.floor(w/DW)):w/DW;      // prefer whole-number pixel scaling
  const cssW=w>=DW?(k*DW<=w&&w-k*DW<DW*0.45?k*DW:w):w;
  cv.style.width=Math.floor(cssW)+'px'; cv.style.height=Math.floor(cssW*DH/DW)+'px';
}
let lastT=0, acc=0, lastPaused=null;
function frame(now){
  const dt=Math.min(100,now-lastT); lastT=now; acc+=dt;
  while(acc>=1000/60){ tick(); acc-=1000/60; }
  if(paused!==lastPaused){ lastPaused=paused; document.getElementById('bPause').textContent=paused?'Resume':'Pause'; }
  render();
  requestAnimationFrame(frame);
}
function boot(){
  cv=document.getElementById('game'); cv.width=DW; cv.height=DH; mctx=cv.getContext('2d');
  scv=document.createElement('canvas'); scv.width=DW; scv.height=DH; sctx=scv.getContext('2d',{willReadFrequently:true});
  ctx=mctx;
  saved=loadSave();
  if(document.fonts&&document.fonts.load){ document.fonts.load('8px "Press Start 2P"').then(()=>{ bgCache={}; }).catch(()=>{}); }
  const down=e=>{
    const k=e.code;
    if(k==='ArrowLeft'||k==='KeyA') keys.l=true;
    else if(k==='ArrowRight'||k==='KeyD') keys.r=true;
    else if(k==='KeyF') keys.g=true;
    else if(k==='ArrowUp'||k==='KeyW'||k==='Space'||k==='KeyZ'||k==='KeyX'){ if(!e.repeat) pressed.jump=true; keys.j=true; if(k==='Space'&&!e.repeat) pressed.act=true; }
    else if(k==='Enter'||k==='NumpadEnter'){ if(!e.repeat){ pressed.act=true; pressed.enter=true; } }
    else if(k==='KeyR'){ if(!e.repeat) pressed.restart=true; }
    else if(k==='KeyP'||k==='Escape'){ if(!e.repeat){ if(settingsOpen) settingsOpen=false; else pressed.pause=true; } }
    else if(k==='KeyM'){ if(!e.repeat) pressed.mute=true; }
    else if(k==='KeyL'){ if(!e.repeat) toggleFlash(); }
    else if(k==='KeyN'){ if(!e.repeat) toggleAmb(); }
    else return;
    ac(); e.preventDefault();
  };
  const upk=e=>{
    const k=e.code;
    if(k==='ArrowLeft'||k==='KeyA') keys.l=false;
    else if(k==='ArrowRight'||k==='KeyD') keys.r=false;
    else if(k==='KeyF') keys.g=false;
    else if(k==='ArrowUp'||k==='KeyW'||k==='Space'||k==='KeyZ'||k==='KeyX') keys.j=false;
  };
  window.addEventListener('keydown',down);
  window.addEventListener('keyup',upk);
  window.addEventListener('blur',()=>{ keys.l=keys.r=keys.j=keys.g=false; if(mode==='play') paused=true; });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&mode==='play') paused=true; });
  cv.addEventListener('pointerdown',e=>{
    ac(); cv.focus();
    const rc=cv.getBoundingClientRect(), x=(e.clientX-rc.left)*VW/rc.width, y=(e.clientY-rc.top)*VH/rc.height;
    if(settingsOpen){ for(const b of setBtns) if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ if(b.id==='flash') toggleFlash(); else if(b.id==='amb') toggleAmb(); else { sfx('menu'); settingsOpen=false; } } return; }
    if(mode==='title'){
      for(const b of titleBtns) if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ if(b.id==='settings'){ sfx('menu'); settingsOpen=true; return; } sfx('menu'); startGame(b.id==='continue'); return; }
    } else if(mode==='card'){ if(cardT>30) nextLevel(); }
    else if(mode==='reunion'||mode==='bossIntro'){ pressed.enter=true; }
    else if(mode==='scene'){ pressed.enter=true; }
    else if(mode==='end'){ if(endT>90) toTitle(); }
    else if(mode==='play'&&paused){ const b=pauseBtn; if(b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h) { sfx('menu'); settingsOpen=true; } else paused=false; }
  });
  document.querySelectorAll('#touch button').forEach(b=>{
    const k=b.dataset.k;
    const dn=e=>{ e.preventDefault(); ac(); touch[k]=true; if(k==='j'){ pressed.jump=true; pressed.act=true; } b.classList.add('on'); try{ b.setPointerCapture(e.pointerId); }catch(_){} };
    const up=e=>{ e.preventDefault(); touch[k]=false; b.classList.remove('on'); };
    b.addEventListener('pointerdown',dn); b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('lostpointercapture',up);
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
  const blurBtn=e=>{ e.currentTarget.blur(); cv.focus(); };
  document.getElementById('bSound').addEventListener('click',e=>{ toggleMute(); blurBtn(e); });
  document.getElementById('bPause').addEventListener('click',e=>{ if(mode==='play') paused=!paused; blurBtn(e); });
  document.getElementById('bRestart').addEventListener('click',e=>{ if(mode==='play'&&!S.win) restartLevel(); blurBtn(e); });
  if('ontouchstart' in window||navigator.maxTouchPoints>0) document.body.classList.add('touch');
  window.addEventListener('touchstart',()=>{ if(!document.body.classList.contains('touch')){ document.body.classList.add('touch'); fit(); } },{once:true,passive:true});
  window.addEventListener('resize',fit); window.addEventListener('orientationchange',()=>setTimeout(fit,150));
  fit(); setTimeout(fit,250);
  lastT=performance.now();
  requestAnimationFrame(frame);
}
if(typeof document!=='undefined') boot();
</script>
